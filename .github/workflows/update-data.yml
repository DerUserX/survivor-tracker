name: Update Survivor data

# Pulls new episodes from the survivoR dataset once a week and redeploys.
on:
  schedule:
    - cron: '0 6 * * 5' # Fridays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run data:refresh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data raw/images.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update Survivor data"
          git push
